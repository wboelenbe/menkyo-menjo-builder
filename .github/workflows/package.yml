# Build the wheel and test it on every push and pull request.  Nothing is
# published: dojo-portal builds its own wheel from a checkout with
# `uv build --wheel`.
#
# The test suite (tests/, with real renders) and the smoke test, which
# renders with the installed wheel from outside the checkout, run the same
# checks as `uv run pytest` and scripts/test-docker.sh do locally: a file left
# out of the package fails here rather than in the portal.
name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - run: uv build

      - name: Install Inkscape, Ghostscript and the crest font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape ghostscript poppler-utils fontconfig fonts-noto-cjk

      # The whole suite, with real renders: REQUIRE_RENDER=1 turns a render
      # test that would skip (no Inkscape) into a failure.
      - name: Test suite
        env:
          REQUIRE_RENDER: "1"
        run: uv run --frozen pytest

      - name: Smoke test the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          cd "$RUNNER_TEMP"
          menkyo="$RUNNER_TEMP/venv/bin/menkyo"
          "$menkyo" --version
          "$menkyo" --example-config > example.toml
          "$menkyo" -c example.toml -a dan -v overlay,overlay-flat --press \
            --json --out out | tee events.jsonl
          tail -n 1 events.jsonl | grep -q '"event": "done"'
          # The flat overlay keeps its text as vectors, so the vendored font
          # must have reached Inkscape and been embedded.
          pdffonts out/dan-overlay-flat-sample.pdf | grep -qi yuji
