# Build the wheel on every push; on a v* tag, also publish it as a GitHub
# Release, which is where dojo-portal fetches it from.
#
# The test suite (tests/, with real renders) and the smoke test, which
# renders with the installed wheel from outside the checkout, both have to
# pass before anything is released: a file left out of the package fails
# here rather than in the portal.
name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"
            exit 1
          fi

      - run: uv build

      - name: Install Inkscape, Ghostscript and the crest font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape ghostscript poppler-utils fontconfig fonts-noto-cjk

      # The whole suite, with real renders: REQUIRE_RENDER=1 turns a render
      # test that would skip (no Inkscape) into a failure.
      - name: Test suite
        env:
          REQUIRE_RENDER: "1"
        run: uv run --frozen pytest

      - name: Smoke test the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          cd "$RUNNER_TEMP"
          menkyo="$RUNNER_TEMP/venv/bin/menkyo"
          "$menkyo" --version
          "$menkyo" --example-config > example.toml
          "$menkyo" -c example.toml -a dan -v overlay,overlay-flat --press \
            --json --out out | tee events.jsonl
          tail -n 1 events.jsonl | grep -q '"event": "done"'
          # The flat overlay keeps its text as vectors, so the vendored font
          # must have reached Inkscape and been embedded.
          pdffonts out/dan-overlay-flat-sample.pdf | grep -qi yuji

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release with the wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
