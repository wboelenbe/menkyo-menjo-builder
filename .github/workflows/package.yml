# Build the wheel and test it on every push and pull request.  Nothing is
# published: dojo-portal builds its own wheel from a checkout with
# `uv build --wheel`.
#
# The test suite (tests/, with real renders) and the smoke test, which
# renders with the installed wheel from outside the checkout, run the same
# checks as `uv run pytest` and scripts/test-docker.sh do locally: a file left
# out of the package fails here rather than in the portal.  Nothing is
# installed from the system: the package needs no program and no font.
name: package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - run: uv build

      # The whole suite, with real renders.
      - name: Test suite
        run: uv run --frozen pytest

      - name: Smoke test the installed wheel
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          cd "$RUNNER_TEMP"
          menkyo="$RUNNER_TEMP/venv/bin/menkyo"
          "$menkyo" --version
          "$menkyo" --example-config > example.toml
          "$menkyo" -c example.toml -a dan -v overlay,overlay-flat \
            --json --out out | tee events.jsonl
          tail -n 1 events.jsonl | grep -q '"event": "done"'
          # The text is drawn as outlines from the fonts inside the package,
          # so a font left out of the wheel fails the render above; this
          # checks the PDFs hold no font of their own either.
          if grep -alq "/FontFile" out/*.pdf; then exit 1; fi
