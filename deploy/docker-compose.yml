# From the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Settings come from deploy/.env (copy deploy/.env.example).
services:
  menkyo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - menkyo-data:/data        # the dojo's settings; survives rebuilds
    expose:
      - "8000"                   # reachable by caddy only, not from outside

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - menkyo
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      AUTH_USER: ${AUTH_USER:?set AUTH_USER in deploy/.env}
      AUTH_HASH: ${AUTH_HASH:?set AUTH_HASH in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # certificates
      - caddy-config:/config

volumes:
  menkyo-data:
  caddy-data:
  caddy-config:
