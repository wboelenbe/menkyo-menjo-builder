[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "menkyo"
# The one place the version lives; `menkyo --version` reports it.
version = "0.6.0"
description = "Japanese dan-grade, kyū-grade and menkyo certificates: vertical A3 or A4 landscape, kyū horizontal on A4 portrait, print-ready"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "NOTICE", "src/menkyo/fonts/OFL.txt",
                 "src/menkyo/fonts/OFL-NotoSerifJP.txt"]
requires-python = ">=3.11"
# No system programs and no system fonts: fontTools reads the glyphs from
# the fonts in fonts/, and pdfium (pypdfium2) draws the PNGs.  pypdfium2 is
# pinned exactly, because its raster bytes move between releases.
dependencies = [
    "pillow>=9.0",
    "numpy>=1.22",
    "scipy>=1.8",
    "fonttools>=4.68",
    "pypdfium2==5.14.0",
]

[project.scripts]
menkyo = "menkyo.build_diploma:cli"

[project.urls]
Homepage = "https://github.com/wboelenbe/menkyo-menjo-builder"

# The wheel is the generator and its command only.
[tool.hatch.build.targets.wheel]
packages = ["src/menkyo"]

[tool.hatch.build.targets.sdist]
include = ["/src/menkyo", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

# Tests: `uv run pytest`.
[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "render: does a real render, seconds each; -m 'not render' is the quick run",
    "slow: builds the wheel and installs it into a throwaway virtualenv",
]
